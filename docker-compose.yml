services:
    app:
        build: .
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=development
            - DATABASE_URL=postgresql://postgres:postgres@db:5432/barbearia
            - JWT_SECRET=barbearia_secret_2026
        depends_on:
            db:
                condition: service_healthy
        restart: on-failure
        networks:
            - barbearia-net

    db:
        image: postgres:15-alpine
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=barbearia
        ports:
            - "5433:5432"
        volumes:
            - barbearia_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d barbearia"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        networks:
            - barbearia-net

networks:
    barbearia-net:
        driver: bridge

volumes:
    barbearia_data:
