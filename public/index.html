<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Barbearia — Agendamento</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <h1>✂️ BARBEARIA</h1>
            <p>Agende seu horário de forma rápida e fácil</p>
        </header>

        <main>
            <form id="form-agendamento">
                <div class="campo">
                    <label>Barbeiro</label>
                    <select id="barbeiro" required>
                        <option value="">Selecione...</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Serviço</label>
                    <select id="servico" required>
                        <option value="">Selecione...</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Data</label>
                    <div class="calendario-wrapper">
                        <div
                            id="data-trigger"
                            onclick="toggleCalendarioCliente()"
                            style="
                                padding: 12px 16px;
                                background: #1a1a1a;
                                border: 1px solid #333;
                                border-radius: 8px;
                                cursor: pointer;
                                color: #f0f0f0;
                                display: flex;
                                justify-content: space-between;
                                align-items: center;
                            "
                        >
                            <span id="data-cliente-texto"
                                >Selecione uma data</span
                            >
                            <span>📅</span>
                        </div>

                        <div id="calendario-cliente" class="calendario-popup">
                            <div
                                style="
                                    display: flex;
                                    justify-content: space-between;
                                    align-items: center;
                                    margin-bottom: 16px;
                                "
                            >
                                <button
                                    onclick="mudarMesCliente(-1)"
                                    style="
                                        background: transparent;
                                        border: none;
                                        color: #c9a84c;
                                        font-size: 1.2rem;
                                        cursor: pointer;
                                        padding: 4px 8px;
                                    "
                                >
                                    ‹
                                </button>
                                <span
                                    id="mes-ano-cliente"
                                    style="font-weight: bold; color: #f0f0f0"
                                ></span>
                                <button
                                    onclick="mudarMesCliente(1)"
                                    style="
                                        background: transparent;
                                        border: none;
                                        color: #c9a84c;
                                        font-size: 1.2rem;
                                        cursor: pointer;
                                        padding: 4px 8px;
                                    "
                                >
                                    ›
                                </button>
                            </div>
                            <div
                                id="cabecalho-semana-cliente"
                                style="
                                    display: grid;
                                    grid-template-columns: repeat(7, 1fr);
                                    gap: 4px;
                                    margin-bottom: 8px;
                                "
                            ></div>
                            <div
                                id="dias-calendario-cliente"
                                style="
                                    display: grid;
                                    grid-template-columns: repeat(7, 1fr);
                                    gap: 4px;
                                "
                            ></div>
                        </div>
                    </div>
                </div>

                <div class="campo">
                    <label>Horário disponível</label>
                    <div id="slots" class="slots-container">
                        <p class="hint">Selecione barbeiro, serviço e data</p>
                    </div>
                </div>

                <div class="campo">
                    <label>Seu nome</label>
                    <input
                        type="text"
                        id="cliente-nome"
                        placeholder="Nome completo"
                        required
                    />
                </div>

                <div class="campo">
                    <label>Seu telefone</label>
                    <input
                        type="tel"
                        id="cliente-telefone"
                        placeholder="(21) 99999-9999"
                        required
                    />
                </div>

                <button type="submit" id="btn-agendar" disabled>
                    Confirmar Agendamento
                </button>
            </form>

            <div id="confirmacao" class="confirmacao hidden">
                <div class="confirmacao-box">
                    <span class="icone">✅</span>
                    <h2>Agendamento confirmado!</h2>
                    <p id="confirmacao-detalhes"></p>
                    <button onclick="resetarFormulario()">
                        Fazer novo agendamento
                    </button>
                </div>
            </div>
        </main>

        <footer
            style="
                text-align: center;
                padding: 24px;
                color: #555;
                font-size: 0.85rem;
                margin-top: 40px;
            "
        >
            Barbearia © 2026
        </footer>

        <!-- Botão WhatsApp fixo -->
        <a
            id="btn-whatsapp"
            href="#"
            target="_blank"
            style="
                position: fixed;
                bottom: 24px;
                right: 24px;
                background: #25d366;
                color: #fff;
                width: 56px;
                height: 56px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                text-decoration: none;
                box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
                z-index: 999;
                transition: transform 0.2s;
            "
            onmouseover="this.style.transform = 'scale(1.1)'"
            onmouseout="this.style.transform = 'scale(1)'"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="white"
            >
                <path
                    d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
                />
            </svg>
        </a>

        <script src="app.js"></script>
    </body>
</html>
