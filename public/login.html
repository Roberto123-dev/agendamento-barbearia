<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login — Barbearia</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            main {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: calc(100vh - 100px);
            }

            .login-box {
                background: #1a1a1a;
                border: 1px solid #333;
                border-radius: 16px;
                padding: 40px;
                width: 100%;
                max-width: 400px;
            }

            .login-box h2 {
                color: #c9a84c;
                margin-bottom: 24px;
                text-align: center;
            }

            .erro {
                background: #3a1a1a;
                color: #d55b5b;
                padding: 10px 16px;
                border-radius: 8px;
                margin-bottom: 16px;
                font-size: 0.9rem;
                display: none;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>✂️ Barbearia</h1>
            <p>Área restrita — Barbeiros</p>
        </header>

        <main>
            <div class="login-box">
                <h2>Entrar no painel</h2>

                <div class="erro" id="erro"></div>

                <div class="campo">
                    <label>Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                    />
                </div>

                <div class="campo">
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="••••••" />
                </div>

                <button type="button" id="btn-login" onclick="fazerLogin()">
                    Entrar
                </button>
            </div>
        </main>

        <script src="login.js"></script>
    </body>
</html>
