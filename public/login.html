<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login — Barbearia</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --gold: #c9a84c;
                --gold-light: #e2c06a;
                --gold-dim: #8a6e2f;
                --black: #0a0a0a;
                --dark: #111111;
                --dark2: #1a1a1a;
                --dark3: #222222;
                --border: #2a2a2a;
                --text: #f0ece4;
                --text-muted: #888070;
                --red: #c0392b;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "DM Sans", sans-serif;
                background: var(--black);
                color: var(--text);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
                pointer-events: none;
                z-index: 0;
                opacity: 0.4;
            }

            /* ── HEADER ── */
            header {
                position: relative;
                background: var(--dark);
                border-bottom: 1px solid var(--border);
                overflow: hidden;
            }

            .header-stripe {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 3px;
                background: linear-gradient(
                    90deg,
                    transparent,
                    var(--gold),
                    var(--gold-light),
                    var(--gold),
                    transparent
                );
            }

            .header-inner {
                max-width: 600px;
                margin: 0 auto;
                padding: 32px 24px 28px;
                display: flex;
                flex-direction: column;
                align-items: center;
                position: relative;
                z-index: 1;
            }

            .logo-wrap {
                width: 72px;
                height: 72px;
                border-radius: 50%;
                background: #fff;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                border: 2px solid var(--gold);
                box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.12);
                margin-bottom: 16px;
                animation: logoIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            @keyframes logoIn {
                from {
                    opacity: 0;
                    transform: scale(0.7);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            .logo-wrap img {
                width: 62px;
                height: 62px;
                object-fit: contain;
            }

            .header-title {
                font-family: "Bebas Neue", sans-serif;
                font-size: 2rem;
                letter-spacing: 0.12em;
                color: var(--text);
                line-height: 1;
                animation: fadeUp 0.7s 0.2s both;
            }

            .header-subtitle {
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 0.85rem;
                color: var(--gold);
                letter-spacing: 0.2em;
                margin-top: 4px;
                animation: fadeUp 0.7s 0.35s both;
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* ── MAIN ── */
            main {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px 20px;
                position: relative;
                z-index: 1;
            }

            /* ── LOGIN BOX ── */
            .login-box {
                background: var(--dark2);
                border: 1px solid var(--border);
                border-top: 2px solid var(--gold);
                border-radius: 8px;
                padding: 40px 32px;
                width: 100%;
                max-width: 400px;
                animation: fadeUp 0.6s 0.1s both;
            }

            .login-title {
                font-family: "Playfair Display", serif;
                font-size: 1.5rem;
                color: var(--gold);
                text-align: center;
                margin-bottom: 8px;
            }

            .login-desc {
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 0.9rem;
                color: var(--text-muted);
                text-align: center;
                margin-bottom: 28px;
                letter-spacing: 0.05em;
            }

            .campo {
                margin-bottom: 18px;
            }

            label {
                display: block;
                font-size: 0.68rem;
                color: var(--text-muted);
                margin-bottom: 6px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                font-weight: 500;
            }

            input[type="email"],
            input[type="password"] {
                width: 100%;
                padding: 13px 16px;
                background: var(--dark);
                border: 1px solid var(--border);
                border-radius: 4px;
                color: var(--text);
                font-size: 0.95rem;
                font-family: "DM Sans", sans-serif;
                outline: none;
                transition:
                    border-color 0.2s,
                    box-shadow 0.2s;
            }

            input:focus {
                border-color: var(--gold-dim);
                box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.08);
            }

            input::placeholder {
                color: #444;
            }

            .erro {
                background: #2a1010;
                border: 1px solid #5a2020;
                color: #d55b5b;
                padding: 10px 14px;
                border-radius: 4px;
                margin-bottom: 16px;
                font-size: 0.85rem;
                display: none;
            }

            .btn-login {
                width: 100%;
                padding: 14px;
                background: var(--gold);
                color: #0a0a0a;
                font-size: 0.82rem;
                font-weight: 700;
                font-family: "DM Sans", sans-serif;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                transition: all 0.2s;
                margin-top: 8px;
            }

            .btn-login:hover:not(:disabled) {
                background: var(--gold-light);
                transform: translateY(-1px);
                box-shadow: 0 6px 20px rgba(201, 168, 76, 0.25);
            }

            .btn-login:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none;
            }

            .voltar-link {
                display: block;
                text-align: center;
                margin-top: 20px;
                color: var(--text-muted);
                font-size: 0.78rem;
                letter-spacing: 0.08em;
                text-decoration: none;
                transition: color 0.15s;
            }

            .voltar-link:hover {
                color: var(--gold);
            }

            /* ── FOOTER ── */
            footer {
                text-align: center;
                padding: 20px;
                color: #333;
                font-size: 0.72rem;
                letter-spacing: 0.1em;
                border-top: 1px solid var(--border);
                position: relative;
                z-index: 1;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="header-stripe"></div>
            <div class="header-inner">
                <div class="logo-wrap">
                    <img
                        id="logo-img"
                        src="/assets/images/logo.png"
                        alt="Logo"
                    />
                </div>
                <h1 class="header-title" id="header-title">Barbershop</h1>
                <p class="header-subtitle">Área restrita — Barbeiros</p>
            </div>
        </header>

        <main>
            <div class="login-box">
                <div class="login-title">Entrar no painel</div>
                <div class="login-desc">Acesse com suas credenciais</div>

                <div class="erro" id="erro"></div>

                <div class="campo">
                    <label>Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                    />
                </div>

                <div class="campo">
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="••••••" />
                </div>

                <button
                    type="button"
                    id="btn-login"
                    class="btn-login"
                    onclick="fazerLogin()"
                >
                    Entrar
                </button>

                <a id="voltar-link" href="/" class="voltar-link"
                    >← Voltar para agendamentos</a
                >
            </div>
        </main>

        <footer>
            <span style="color: #333">✦</span>
            &nbsp; Barbershop &copy; 2026 &nbsp;
            <span style="color: #333">✦</span>
        </footer>

        <script src="/login.js"></script>
    </body>
</html>
